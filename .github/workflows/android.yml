name: NOOR Android validation and APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noor-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve NOOR project directory
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            mkdir -p "$RUNNER_TEMP/noor-source"
            python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP/noor-source" <<'PYZIP'
          import re
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          root, destination = map(Path, sys.argv[1:])
          candidates = []
          for archive in root.glob('*.zip'):
              try:
                  with zipfile.ZipFile(archive) as bundle:
                      entries = [n for n in bundle.namelist()
                                 if PurePosixPath(n).name == 'pubspec.yaml']
                      if not entries:
                          continue
                      # Prefer the latest explicitly versioned NOOR continuation archive.
                      match = re.search(r'_R(\d+)(?:\.|$)', archive.name, re.I)
                      version = int(match.group(1)) if match else 0
                      preferred = 1 if 'NOOR' in archive.name.upper() else 0
                      candidates.append((preferred, version, archive.name, archive, entries[0]))
              except (OSError, zipfile.BadZipFile):
                  continue

          if not candidates:
              raise SystemExit('No ZIP archive containing pubspec.yaml was found in the repository root.')
          _, _, _, archive, pubspec_entry = max(candidates)
          with zipfile.ZipFile(archive) as bundle:
              for info in bundle.infolist():
                  target = (destination / info.filename).resolve()
                  if target != destination.resolve() and destination.resolve() not in target.parents:
                      raise SystemExit(f'Unsafe path in source archive: {info.filename}')
              bundle.extractall(destination)
          print(f'Using source archive: {archive.name}')
          PYZIP
            PUBSPEC="$(find "$RUNNER_TEMP/noor-source" -name pubspec.yaml -print -quit)"
            test -n "$PUBSPEC"
            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi
          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter pub get

      - name: Format Dart sources
        working-directory: ${{ steps.project.outputs.path }}
        run: dart format lib test

      - name: Analyze
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter analyze

      - name: Run tests
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter test --reporter expanded

      - name: Prepare existing release signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ steps.project.outputs.path }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/noor-upload.jks
          test -s android/app/noor-upload.jks
          python3 - <<'PY'
          import os
          from pathlib import Path
          def prop(value):
              value = value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
              return ''.join(('\\' + ch) if ch in '=:# !' else ch for ch in value)
          lines = [
              'storeFile=noor-upload.jks',
              'storePassword=' + prop(os.environ['KEYSTORE_PASSWORD']),
              'keyAlias=' + prop(os.environ['KEY_ALIAS']),
              'keyPassword=' + prop(os.environ['KEY_PASSWORD']),
          ]
          Path('android/key.properties').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Build signed release APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter build apk --release

      - name: Verify APK signature
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Remove signing material before source packaging
        if: always() && steps.project.outputs.path != ''
        working-directory: ${{ steps.project.outputs.path }}
        run: rm -f android/key.properties android/app/noor-upload.jks android/local.properties

      - name: Package validated source
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .dart_tool .packages android/.gradle
          mkdir -p "$RUNNER_TEMP/noor-package"
          zip -qr "$RUNNER_TEMP/NOOR_Source.zip" . -x '.git/*' '.dart_tool/*' 'build/*' 'android/.gradle/*'

      - name: Upload signed APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-APK-Release
          if-no-files-found: error
          path: ${{ steps.project.outputs.path }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload validated source archive
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-Source-Package
          if-no-files-found: error
          path: ${{ runner.temp }}/NOOR_Source.zip
