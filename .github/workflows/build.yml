name: NOOR Android APK Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noor-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract the complete NOOR source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/NOOR_Source.zip"
          unzip -tq "$GITHUB_WORKSPACE/NOOR_Source.zip"
          mkdir -p "$RUNNER_TEMP/noor-source"
          unzip -q "$GITHUB_WORKSPACE/NOOR_Source.zip" -d "$RUNNER_TEMP/noor-source"
          PUBSPEC="$(find "$RUNNER_TEMP/noor-source" -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          test -f "$PROJECT_DIR/lib/main.dart"
          test -d "$PROJECT_DIR/assets"
          test -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          echo "NOOR_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Verify signing secrets and configure release signing
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          SIGNING_DIR="$RUNNER_TEMP/noor-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/noor-release.jks"
          test -s "$SIGNING_DIR/noor-release.jks"
          {
            printf 'storeFile=%s\n' "$SIGNING_DIR/noor-release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          python3 tool/configure_android_signing.py "$PWD"

      - name: Configure temporary CI-only signing
        if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/noor-signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/noor-signing/ci-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=NOOR CI,O=NOOR,C=EG" -keyalg RSA -keysize 2048 -validity 10000
          cat > android/key.properties <<EOF2
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$RUNNER_TEMP/noor-signing/ci-debug.keystore
          EOF2

      - name: Install dependencies
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter pub get

      - name: Format Dart sources
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: dart format lib test

      - name: Verify Dart formatting
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify release APK signature
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Always clean signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${{ env.NOOR_PROJECT_DIR }}" ]; then rm -f "${{ env.NOOR_PROJECT_DIR }}/android/key.properties"; fi
          rm -rf "$RUNNER_TEMP/noor-signing"

      - name: Upload complete NOOR source archive
        uses: actions/upload-artifact@v7
        with:
          name: NOOR-Source-Package
          if-no-files-found: error
          path: NOOR_Source.zip

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ (github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))) && 'NOOR-APK-CI-TestKey' || 'NOOR-APK-Release-Signed' }}
          if-no-files-found: error
          path: ${{ env.NOOR_PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
