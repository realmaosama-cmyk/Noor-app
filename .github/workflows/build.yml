name: NOOR Android APK Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noor-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Extract latest NOOR source archive and apply full upgrade
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/NOOR_Source.zip"
          mkdir -p "$RUNNER_TEMP/noor-extracted"
          unzip -q "$GITHUB_WORKSPACE/NOOR_Source.zip" -d "$RUNNER_TEMP/noor-extracted"
          PUBSPEC="$(find "$RUNNER_TEMP/noor-extracted" -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          OVERLAY_B64="$GITHUB_WORKSPACE/.github/noor-overlay.tar.b64"
          test -f "$OVERLAY_B64"
          base64 --decode "$OVERLAY_B64" | tar -xf - -C "$PROJECT_DIR"
          # Import the preserved legacy datasets and apply the NOOR 1.4 content/identity layer.
          test -d "$GITHUB_WORKSPACE/legacy_content/assets/content"
          test -f "$GITHUB_WORKSPACE/noor_upgrade/patch_noor.py"
          mkdir -p "$PROJECT_DIR/assets/content/legacy" "$PROJECT_DIR/lib/data/content"
          cp -a "$GITHUB_WORKSPACE/legacy_content/assets/content/." "$PROJECT_DIR/assets/content/legacy/"
          python3 "$GITHUB_WORKSPACE/.github/scripts/fetch_full_quran.py" "$GITHUB_WORKSPACE/legacy_content/assets/content"
          python3 "$GITHUB_WORKSPACE/.github/scripts/validate_noor_content.py" "$GITHUB_WORKSPACE/legacy_content/assets/content"
          cp "$GITHUB_WORKSPACE/noor_upgrade/lib/data/content/legacy_content.dart" "$PROJECT_DIR/lib/data/content/legacy_content.dart"
          cp "$GITHUB_WORKSPACE/noor_upgrade/lib/features/home/legacy_content_screen.dart" "$PROJECT_DIR/lib/features/home/legacy_content_screen.dart"
          cp "$GITHUB_WORKSPACE/noor_upgrade/lib/features/home/quran_library_screen.dart" "$PROJECT_DIR/lib/features/home/quran_library_screen.dart"
          mkdir -p "$PROJECT_DIR/test"
          cp -a "$GITHUB_WORKSPACE/noor_upgrade/test/." "$PROJECT_DIR/test/"
          python3 "$GITHUB_WORKSPACE/noor_upgrade/patch_noor.py" "$PROJECT_DIR"
          test -f "$PROJECT_DIR/lib/features/home/welcome_screen.dart"
          test -f "$PROJECT_DIR/tool/configure_android_branding.sh"
          mkdir -p "$RUNNER_TEMP/noor-workspace"
          cp -a "$PROJECT_DIR"/. "$RUNNER_TEMP/noor-workspace/"
          echo "NOOR_PROJECT_DIR=$RUNNER_TEMP/noor-workspace" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android platform files when absent
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.noor --project-name noor .
          fi
          chmod +x tool/configure_android_branding.sh
          ./tool/configure_android_branding.sh

      - name: Verify signing secrets and configure release signing
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          SIGNING_DIR="$RUNNER_TEMP/noor-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/noor-release.jks"
          test -s "$SIGNING_DIR/noor-release.jks"
          {
            printf 'storeFile=%s\n' "$SIGNING_DIR/noor-release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          python3 tool/configure_android_signing.py "$PWD"

      - name: Configure temporary CI-only Android signing
        if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/noor-signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/noor-signing/ci-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=NOOR CI,O=NOOR,C=EG" -keyalg RSA -keysize 2048 -validity 10000
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$RUNNER_TEMP/noor-signing/ci-debug.keystore
          EOF

      - name: Verify NOOR project tests
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: test -f test/widget_test.dart

      - name: Install dependencies
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter pub get

      - name: Format Dart sources
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: dart format lib test

      - name: Analyze
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter test

      - name: Build release APK (signed on protected main/tag only)
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter build apk --release

      - name: Verify APK signature
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          rm -f android/key.properties

      - name: Always clean signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${{ env.NOOR_PROJECT_DIR }}" ]; then rm -f "${{ env.NOOR_PROJECT_DIR }}/android/key.properties"; fi
          rm -rf "$RUNNER_TEMP/noor-signing"

      - name: Upload APK build result
        uses: actions/upload-artifact@v7
        with:
          name: ${{ (github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/'))) && 'NOOR-APK-CI-TestKey' || 'NOOR-APK-Release-Signed' }}
          if-no-files-found: error
          path: ${{ env.NOOR_PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk