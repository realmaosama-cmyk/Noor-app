name: NOOR Android APK Build
# Validate the full NOOR overlay on every PR update.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noor-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Extract latest NOOR source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/NOOR_Source.zip"
          mkdir -p "$RUNNER_TEMP/noor-extracted"
          unzip -q "$GITHUB_WORKSPACE/NOOR_Source.zip" -d "$RUNNER_TEMP/noor-extracted"
          PUBSPEC="$(find "$RUNNER_TEMP/noor-extracted" -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          OVERLAY_B64="$GITHUB_WORKSPACE/.github/noor-overlay.tar.b64"
          if [ -f "$OVERLAY_B64" ] && [ ! -f "$PROJECT_DIR/lib/features/home/feature_hub_screen.dart" ]; then
            base64 --decode "$OVERLAY_B64" | tar -xf - -C "$PROJECT_DIR"
          fi
          mkdir -p "$RUNNER_TEMP/noor-workspace"
          cp -a "$PROJECT_DIR"/. "$RUNNER_TEMP/noor-workspace/"
          echo "NOOR_PROJECT_DIR=$RUNNER_TEMP/noor-workspace" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android platform files when absent
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.noor --project-name noor .
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="نور | NOOR"/' "$MANIFEST"
          fi

      - name: Verify NOOR project tests
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: test -f test/widget_test.dart

      - name: Install dependencies
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter pub get

      - name: Format Dart sources
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: dart format lib test

      - name: Analyze
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter test

      - name: Build release APK only
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        run: flutter build apk --release

      - name: Package normalized source archive
        working-directory: ${{ env.NOOR_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/noor-package/Nour-and-fedaa-main"
          cp -a . "$RUNNER_TEMP/noor-package/Nour-and-fedaa-main/"
          rm -rf "$RUNNER_TEMP/noor-package/Nour-and-fedaa-main/build" \
            "$RUNNER_TEMP/noor-package/Nour-and-fedaa-main/.dart_tool" \
            "$RUNNER_TEMP/noor-package/Nour-and-fedaa-main/.packages" \
            "$RUNNER_TEMP/noor-package/Nour-and-fedaa-main/android/.gradle" \
            "$RUNNER_TEMP/noor-package/Nour-and-fedaa-main/android/local.properties" \
            "$RUNNER_TEMP/noor-package/Nour-and-fedaa-main/NOOR_Source.zip"
          (cd "$RUNNER_TEMP/noor-package" && zip -qr "$RUNNER_TEMP/NOOR_Source.zip" Nour-and-fedaa-main)

      - name: Refresh source archive on the working branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/NOOR_Source.zip" "$GITHUB_WORKSPACE/NOOR_Source.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NOOR_Source.zip
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh NOOR source archive after APK validation"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload APK release and source archive
        uses: actions/upload-artifact@v7
        with:
          name: NOOR-APK-Release
          if-no-files-found: error
          path: |
            ${{ env.NOOR_PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/NOOR_Source.zip
